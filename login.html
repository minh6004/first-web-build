<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>로그인 · StockLens</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
  <meta name="theme-color" content="#ffffff" />
</head>
<body>
  <a class="skip-link" href="#auth-main">본문으로 건너뛰기</a>

  <header class="site-header" id="siteHeader">
    <div class="container">
      <a class="logo" href="index.html">StockLens</a>
      <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="navList" aria-label="메뉴 열기">
        <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
      </button>
      <nav>
        <ul class="nav-list" id="navList">
          <li><a href="index.html#features">기능</a></li>
          <li><a href="issue-briefing.html">이슈 브리핑</a></li>
          <li><a href="login.html" id="navAuthLink" aria-current="page">로그인</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="auth-main">
    <section class="auth" id="auth">
      <div class="container">
        <div class="auth-card card">
          <h1>로그인</h1>
          <form id="loginForm" class="auth-form">
            <div class="filter-field">
              <label for="email">아이디</label>
              <input type="email" id="email" name="email" autocomplete="email" placeholder="example@email.com" required />
            </div>
            <div class="filter-field">
              <label for="password">비밀번호</label>
              <input type="password" id="password" name="password" autocomplete="current-password" required />
            </div>
            <button type="submit" class="btn btn-primary auth-submit">로그인</button>
            <p class="auth-message" id="loginMessage" role="status" aria-live="polite"></p>
          </form>
          <p class="auth-switch">계정이 없으신가요? <a href="signup.html">회원가입</a></p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="siteFooter">
    <div class="container">
      <span>&copy; 2026 StockLens</span>
      <ul class="footer-links">
        <li><a href="#">이용약관</a></li>
        <li><a href="#">개인정보처리방침</a></li>
      </ul>
    </div>
    <p class="ai-credit">Powered by [AI 이름 · 버전 플레이스홀더]</p>
  </footer>

  <script type="module" src="login.js"></script>
</body>
</html>
