name: Daily Issue Briefing Collection

on:
  schedule:
    # 매일 07:00 KST = 전날 22:00 UTC
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# 스케줄 실행 중에 수동 실행이 겹치면 둘 다 같은 data/ 파일에 커밋하려다
# 충돌할 수 있어서, 겹치는 실행은 뒤에서 대기하도록 한다(취소하지 않음 --
# 둘 다 완료는 시키되 순서대로).
concurrency:
  group: daily-issue-briefing
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # scripts/collect-all.mjs 하나가 DART/Fed/SEC/관세청/ECOS/GDELT/네이버뉴스
      # 7개 소스 수집 + AI 검수 게이트 + 종합 신호 집계를 전부 내부에서 처리한다
      # (각 소스의 개별 collect-events.mjs는 "이 소스 결과만" data/latest.json을
      # 덮어쓰는 단독 디버그 CLI라서, 워크플로에서 여러 개를 순서대로 돌리면 서로
      # 덮어써 버린다 -- 반드시 collect-all.mjs 하나만 호출할 것).
      # 소스 하나가 실패해도(키 누락, 외부 API 장애/레이트리밋 등) 나머지 소스로
      # 계속 진행하도록 스크립트 내부에서 이미 처리하므로, 이 스텝은 그대로 둔다.
      - name: Collect and merge issue briefing data
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          NCP_API_KEY_ID: ${{ secrets.NCP_API_KEY_ID }}
          NCP_API_KEY: ${{ secrets.NCP_API_KEY }}
          # Claude Code 로그인용 OAuth 토큰(sk-ant-o...)이 아니라, workspace가
          # 지정된 일반 Anthropic API 키(sk-ant-api03-...)를 등록할 것 --
          # OAuth 토큰을 쓰면 Messages API가 401로 거부한다(로컬에서 실제로 겪음).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/collect-all.mjs

      - name: Commit and push updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily issue briefing data update"
          file_pattern: "data/**"
