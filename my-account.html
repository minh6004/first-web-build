<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>나의 계좌 · StockLens</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="my-account.css" />
  <meta name="theme-color" content="#ffffff" />
</head>
<body>
  <a class="skip-link" href="#account-main">본문으로 건너뛰기</a>

  <header class="site-header" id="siteHeader">
    <div class="container">
      <a class="logo" href="index.html">StockLens</a>
      <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="navList" aria-label="메뉴 열기">
        <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
      </button>
      <nav>
        <ul class="nav-list" id="navList">
          <!-- '나의 계좌' 네비게이션 항목은 잠시 숨김 처리(코드/페이지는 그대로 유지, 나중에 다시 노출 가능):
          <li><a href="my-account.html" aria-current="page">나의 계좌</a></li>
          -->
          <li><a href="stock-search.html">주식 검색</a></li>
          <li><a href="issue-briefing.html">이슈 브리핑</a></li>
          <li><a href="login.html" id="navAuthLink">로그인</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="account-main">
    <section class="account" id="account-page">
      <div class="container">
        <h1>나의 계좌</h1>

        <div class="account-card card" id="accountEmptyState">
          <p class="account-empty-title">아직 연동된 계좌가 없습니다</p>
          <p class="account-empty-desc">계좌를 연동하면 보유 종목·평가금액 등을 한눈에 볼 수 있어요.</p>
          <button type="button" class="btn btn-primary" id="connectAccountBtn">계좌 연동하기</button>
        </div>

        <!-- 실제 증권사 API 연동 후 isAccountLinked()가 true를 반환하게 되면
             이 영역에 보유 종목/평가금액 등을 채운다. 지금은 항상 hidden. -->
        <div class="account-card card" id="accountLinkedState" hidden>
          <p>연동된 계좌 정보가 여기 표시됩니다.</p>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="accountToast" role="status" aria-live="polite"></div>

  <footer class="site-footer" id="siteFooter">
    <div class="container">
      <span>&copy; 2026 StockLens</span>
      <ul class="footer-links">
        <li><a href="terms.html">이용약관</a></li>
        <li><a href="privacy.html">개인정보처리방침</a></li>
      </ul>
    </div>
    <p class="footer-disclaimer">본 서비스는 투자 자문을 제공하지 않으며, 모든 콘텐츠는 정보 제공 목적입니다.</p>
    <p class="ai-credit">Powered by [AI 이름 · 버전 플레이스홀더]</p>
  </footer>

  <script type="module" src="my-account.js"></script>
</body>
</html>
