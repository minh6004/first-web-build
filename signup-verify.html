<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>회원가입 (3/4) 본인인증 · StockLens</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
  <meta name="theme-color" content="#ffffff" />
</head>
<body>
  <a class="skip-link" href="#auth-main">본문으로 건너뛰기</a>

  <header class="site-header" id="siteHeader">
    <div class="container">
      <a class="logo" href="index.html">StockLens</a>
      <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="navList" aria-label="메뉴 열기">
        <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
      </button>
      <nav>
        <ul class="nav-list" id="navList">
          <!-- '나의 계좌' 네비게이션 항목은 잠시 숨김 처리(코드/페이지는 그대로 유지, 나중에 다시 노출 가능):
          <li><a href="my-account.html">나의 계좌</a></li>
          -->
          <li><a href="stock-search.html">주식 검색</a></li>
          <li><a href="issue-briefing.html">이슈 브리핑</a></li>
          <li><a href="login.html" id="navAuthLink">로그인</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="auth-main">
    <section class="auth" id="auth">
      <div class="container">
        <ol class="signup-steps" aria-label="회원가입 진행 단계">
          <li class="is-done">✓ 약관 동의</li>
          <li class="is-done">✓ 정보 입력</li>
          <li class="is-current">3. 본인인증</li>
          <li>4. 가입완료</li>
        </ol>

        <div class="auth-card card">
          <h1>회원가입</h1>

          <!-- 2단계(signup-info.html)가 sessionStorage에 저장해둔
               signupFormData의 전화번호로 인증한다. 인증에 성공하는
               순간 실제로 Firebase Authentication 계정을 만들고
               Firestore에 프로필을 저장한다(signup-verify.js) -- 스펙상
               "전화번호 인증이 필수 절차"이므로, 인증되지 않은 사람의
               계정은 아예 만들지 않는다. -->
          <p class="verify-phone-display">
            전화번호 <strong id="maskedPhone">-</strong>로 인증번호를 받으시겠어요?
          </p>

          <button type="button" class="btn btn-primary auth-submit" id="requestOtpBtn">인증번호 받기</button>

          <div class="otp-row" id="otpRow" hidden>
            <input type="text" id="otpCode" inputmode="numeric" maxlength="6" placeholder="인증번호" aria-label="인증번호 6자리" autocomplete="one-time-code" />
            <button type="button" class="btn btn-secondary" id="verifyOtpBtn">확인</button>
            <span class="otp-timer" id="otpTimer" aria-live="polite"></span>
          </div>
          <p class="field-hint" id="otpHint" role="status" aria-live="polite"></p>

          <button type="button" class="btn btn-primary auth-submit" id="nextStepBtn" disabled>다음</button>
          <p class="auth-message" id="verifyMessage" role="status" aria-live="polite"></p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="siteFooter">
    <div class="container">
      <span>&copy; 2026 StockLens</span>
      <ul class="footer-links">
        <li><a href="terms.html">이용약관</a></li>
        <li><a href="privacy.html">개인정보처리방침</a></li>
      </ul>
    </div>
    <p class="footer-disclaimer">본 서비스는 투자 자문을 제공하지 않으며, 모든 콘텐츠는 정보 제공 목적입니다.</p>
    <p class="ai-credit">Powered by [AI 이름 · 버전 플레이스홀더]</p>
  </footer>

  <script type="module" src="signup-verify.js"></script>
</body>
</html>
