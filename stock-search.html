<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>주식 검색 · StockLens</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="stock-search.css" />
  <meta name="theme-color" content="#ffffff" />
</head>
<body>
  <a class="skip-link" href="#stock-search-main">본문으로 건너뛰기</a>

  <header class="site-header" id="siteHeader">
    <div class="container">
      <a class="logo" href="index.html">StockLens</a>
      <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="navList" aria-label="메뉴 열기">
        <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
      </button>
      <nav>
        <ul class="nav-list" id="navList">
          <!-- '나의 계좌' 네비게이션 항목은 잠시 숨김 처리(코드/페이지는 그대로 유지, 나중에 다시 노출 가능):
          <li><a href="my-account.html">나의 계좌</a></li>
          -->
          <li><a href="stock-search.html" aria-current="page">주식 검색</a></li>
          <li><a href="issue-briefing.html">이슈 브리핑</a></li>
          <li><a href="login.html" id="navAuthLink">로그인</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="stock-search-main">
    <section class="stock-search" id="stock-search-page">
      <div class="container">
        <h1>주식 검색</h1>

        <div class="stock-search-layout">
          <!-- 왼쪽: 오늘의 등락 현황판. 더미 데이터는 stock-search.js의
               getTopMovers()가 반환 -- 나중에 실제 시세 API로 교체할 때 이
               함수 내부만 바꾸면 된다. -->
          <div class="stock-movers-panel">
            <h2 class="stock-movers-heading">오늘 가장 많이 오른 TOP 5</h2>
            <ol class="mover-list" id="gainerList"></ol>

            <h2 class="stock-movers-heading">오늘 가장 많이 내린 TOP 5</h2>
            <ol class="mover-list" id="loserList"></ol>
          </div>

          <!-- 오른쪽: 검색 + 필터 + 결과 + 선택한 종목 분석. 필터를 포함한
               검색 로직은 stock-search.js의 searchStocks(query, filters),
               분석 텍스트는 getStockAnalysis(name)으로 분리되어 있다. -->
          <div class="stock-analysis-panel">
            <div class="stock-search-controls">
              <div class="search-field stock-search-field">
                <label for="stockSearchInput" class="visually-hidden">종목명 또는 티커 검색</label>
                <input type="search" id="stockSearchInput" placeholder="종목명 또는 티커 검색…" autocomplete="off" />
              </div>
              <div class="filter-field">
                <label for="marketFilter">국내/해외</label>
                <select id="marketFilter">
                  <option value="all">전체</option>
                  <option value="domestic">국내</option>
                  <option value="overseas">해외</option>
                </select>
              </div>
              <div class="filter-field">
                <label for="sectorFilter">섹터</label>
                <select id="sectorFilter">
                  <option value="all">전체</option>
                  <option value="반도체">반도체</option>
                  <option value="2차전지">2차전지</option>
                  <option value="바이오">바이오</option>
                  <option value="금융">금융</option>
                  <option value="에너지">에너지</option>
                  <option value="IT/플랫폼">IT/플랫폼</option>
                </select>
              </div>
            </div>

            <ul class="stock-result-list" id="stockResultList"></ul>
            <p class="stock-empty-message" id="stockEmptyMessage" hidden>검색 결과가 없습니다</p>

            <div class="stock-analysis" id="stockAnalysis" hidden>
              <p class="stock-analysis-label">분석</p>
              <h3 id="stockAnalysisTitle"></h3>
              <p id="stockAnalysisText"></p>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="siteFooter">
    <div class="container">
      <span>&copy; 2026 StockLens</span>
      <ul class="footer-links">
        <li><a href="#">이용약관</a></li>
        <li><a href="#">개인정보처리방침</a></li>
      </ul>
    </div>
    <p class="ai-credit">Powered by [AI 이름 · 버전 플레이스홀더]</p>
  </footer>

  <script type="module" src="stock-search.js"></script>
</body>
</html>
