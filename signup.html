<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>회원가입 · StockLens</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
  <meta name="theme-color" content="#ffffff" />
</head>
<body>
  <a class="skip-link" href="#auth-main">본문으로 건너뛰기</a>

  <header class="site-header" id="siteHeader">
    <div class="container">
      <a class="logo" href="index.html">StockLens</a>
      <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="navList" aria-label="메뉴 열기">
        <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
      </button>
      <nav>
        <ul class="nav-list" id="navList">
          <!-- '나의 계좌' 네비게이션 항목은 잠시 숨김 처리(코드/페이지는 그대로 유지, 나중에 다시 노출 가능):
          <li><a href="my-account.html">나의 계좌</a></li>
          -->
          <li><a href="stock-search.html">주식 검색</a></li>
          <li><a href="issue-briefing.html">이슈 브리핑</a></li>
          <li><a href="login.html" id="navAuthLink">로그인</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="auth-main">
    <section class="auth" id="auth">
      <div class="container">
        <div class="auth-card card">
          <h1>회원가입</h1>

          <!-- Firebase Authentication(이메일/비밀번호)으로 실제 계정을 만들고,
               Firestore users/{uid} 문서에 닉네임/생년월일을 저장한다
               (signup.js 참고). 보안 규칙(firestore.rules)이 본인 문서만
               읽고 쓸 수 있도록 제한한다. -->
          <form id="signupForm" class="auth-form">
            <div class="filter-field">
              <label for="nickname">닉네임</label>
              <input type="text" id="nickname" name="nickname" required />
            </div>
            <div class="filter-field">
              <label for="birthdate">생년월일</label>
              <input type="date" id="birthdate" name="birthdate" required />
            </div>
            <div class="filter-field">
              <label for="email">아이디</label>
              <input type="email" id="email" name="email" autocomplete="email" placeholder="example@email.com" required />
            </div>
            <div class="filter-field">
              <label for="signupPassword">비밀번호</label>
              <input type="password" id="signupPassword" name="password" autocomplete="new-password" required />
            </div>

            <div class="auth-terms">
              <label class="auth-terms-check">
                <input type="checkbox" id="agreeTerms" name="agreeTerms" required />
                이용약관에 동의합니다
              </label>
              <a class="auth-terms-toggle" href="terms.html" target="_blank" rel="noopener">약관 보기</a>
            </div>

            <button type="submit" class="btn btn-primary auth-submit" id="signupSubmit" disabled>가입하기</button>
            <p class="auth-message" id="signupMessage" role="status" aria-live="polite"></p>
          </form>
          <p class="auth-switch">이미 계정이 있으신가요? <a href="login.html">로그인</a></p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="siteFooter">
    <div class="container">
      <span>&copy; 2026 StockLens</span>
      <ul class="footer-links">
        <li><a href="terms.html">이용약관</a></li>
        <li><a href="#">개인정보처리방침</a></li>
      </ul>
    </div>
    <p class="footer-disclaimer">본 서비스는 투자 자문을 제공하지 않으며, 모든 콘텐츠는 정보 제공 목적입니다.</p>
    <p class="ai-credit">Powered by [AI 이름 · 버전 플레이스홀더]</p>
  </footer>

  <script type="module" src="signup.js"></script>
</body>
</html>
